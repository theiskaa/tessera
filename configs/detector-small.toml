name = "detector-small"
task = "detector"
seed = 42

[data]
countries = ["US", "GB", "DE", "GE", "JP"]
train_per_country = 30000
valid_per_country = 3000
test_per_country = 3000
manifests = "data/manifests"
processed = "data/processed/detector"

[features]
ngram_sizes = [2, 3, 4]
hash_buckets = 65536
hash_seed = 0
ngram_dim = 48
shape_dim = 16

[net]
hidden = 96
kernel = 3
dilations = [1, 2, 4, 8, 16, 1]
dropout = 0.1
max_params = 1000000

[train]
epochs = 10
batch_size = 32
learning_rate = 0.001
