name = "parser-small-100000"
task = "parser"
seed = 42

[data]
source = "libpostal-osm-addresses"
countries = ["GB", "GE", "DE", "US", "JP"]
train_per_country = 100000
valid_per_country = 3000
test_per_country = 3000
manifests = "data/manifests"
processed = "data/processed/parser-curve"
sample_manifest = "data/processed/parser-curve/sample.json"

[features]
ngram_sizes = [2, 3, 4]
hash_buckets = 32768
hash_seed = 0
ngram_dim = 48
shape_dim = 16

[net]
hidden = 96
kernel = 3
dilations = [1, 2, 4, 8]
dropout = 0.1
max_params = 1000000

[train]
epochs = 10
batch_size = 64
learning_rate = 0.001

[augment]
copies = 2
