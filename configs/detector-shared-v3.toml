name = "detector-us-v3"
task = "detector"
seed = 42

[data]
countries = ["US"]
train_per_country = 30000
valid_per_country = 3000
test_per_country = 3000
manifests = "data/manifests/v3"
processed = "data/processed/detector-us-v3"

[features]
ngram_sizes = [2, 3, 4]
hash_buckets = 32768
hash_seed = 0
ngram_dim = 48
shape_dim = 16

[net]
hidden = 96
kernel = 3
dilations = [1, 2, 4, 8, 16, 1]
dropout = 0.1
max_params = 1000000
ngram_from = "runs/parser-us-v1"

[train]
epochs = 3
batch_size = 32
learning_rate = 0.0001
gradient_clip_norm = 1.0
warmup_steps = 500
patience = 2

[detector]
class_weights = [1.0, 3.0, 2.0, 3.0, 2.0, 2.0, 1.5]
silver = ["data/interim/silver/us-reviewed-strict-safe-v1.jsonl", "data/interim/silver/us-house-staff-v1.jsonl", "data/interim/silver/us-house-district-offices-v1.jsonl", "data/interim/silver/us-reviewed-contact-snippets-safe-v1.jsonl", "data/interim/silver/us-reviewed-org-paragraphs-safe-v1.jsonl", "data/interim/silver/us-r23-reviewed-org-safe-v1.jsonl", "data/interim/silver/us-federal-org-reviewed-safe-v1.jsonl", "data/interim/silver/us-park-contacts-v1.jsonl", "data/interim/silver/us-or-districts-v1.jsonl", "data/interim/silver/us-2025-year-contacts-v2.jsonl", "data/interim/silver/us-2025-year-acronym-prose-v3.jsonl", "data/interim/silver/us-2025-year-contact-expansion-safe-v1.jsonl", "data/interim/silver/us-2025-targeted-contacts-v1.jsonl", "data/interim/silver/us-r25-reviewed-contacts-v1.jsonl", "data/interim/silver/us-official-reviewed-contacts-v1.jsonl", "data/interim/silver/us-military-reviewed-addresses-v1.jsonl", "data/interim/silver/us-nrcs-reviewed-field-offices-v1.jsonl", "data/interim/silver/us-dol-whd-reviewed-offices-v1.jsonl", "data/interim/silver/us-dol-whd-reviewed-remaining-v1.jsonl", "data/interim/silver/us-environmental-hard-negatives-v1.jsonl", "data/interim/silver/us-nrcs-maine-reviewed-offices-v1.jsonl"]
silver_repeat = 1
silver_repeats = [16, 1, 32, 16, 8, 8, 8, 16, 16, 16, 16, 16, 16, 16, 16, 16, 16, 16, 16, 32, 32]
synthetic_per_epoch = 60000

[names]
countries = ["US"]
people_per_country = 20000
orgs_per_country = 20000
raw = "data/raw"
interim = "data/interim"
out = "data/processed/names-us-v1"
sample_seed = 42
birth_years = [1930, 2005]

[generate]
train = 170000
valid = 10000
test_seen = 10000
test_heldout_templates = 5000
test_heldout_families = 5000
addresses = "data/processed/parser-us-v1"
exclude_gold = "data/interim/review/us-eval-exclusions-v3.jsonl"
max_tokens = 900
