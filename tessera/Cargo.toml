[package]
name = "tessera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Find people, organizations, addresses, emails, and phone numbers in text and assemble them into contacts, locally"
keywords = ["ner", "address", "contacts", "wasm", "extraction"]
categories = ["text-processing", "wasm"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["phone-metadata"]
phone-metadata = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:web-sys"]
cli = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "EventTarget",
    "MessageEvent",
    "Response",
    "Worker",
    "WorkerOptions",
    "WorkerType",
], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "tessera"
path = "src/bin/tessera.rs"
required-features = ["cli"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
# The justfile runs wasm-opt itself, with feature flags that differ between the two variants.
wasm-opt = false
