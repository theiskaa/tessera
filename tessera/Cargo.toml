[package]
name = "tessera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Find people, organizations, addresses, emails, and phone numbers in text and assemble them into contacts, locally"
keywords = ["ner", "address", "contacts", "wasm", "extraction"]
categories = ["text-processing", "wasm"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["phone-metadata"]
phone-metadata = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
cli = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "tessera"
path = "src/bin/tessera.rs"
required-features = ["cli"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
# The wasm32 target enables these features by default since Rust 1.82; wasm-opt must be told.
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]
